sonar.projectKey=pokeplan
sonar.projectName=PokePlan
sonar.sourceEncoding=UTF-8

# Sources and tests live in separate folders.
sonar.sources=web/src,web/index.html,web/vite.config.ts,scripts
sonar.tests=web/test,scripts/test,e2e
sonar.exclusions=**/node_modules/**,**/dist/**,reports/**,scripts/test/**

# Entry points and generated files without logic worth measuring.
sonar.coverage.exclusions=web/src/main.tsx,web/src/types.ts,web/src/sync/firebase.ts,web/vite.config.ts,web/index.html,scripts/build-data.mjs,scripts/make-icons.mjs,scripts/sonar.mjs,scripts/lighthouse.mjs,scripts/showcase.mjs

sonar.javascript.lcov.reportPaths=coverage/lcov.info
